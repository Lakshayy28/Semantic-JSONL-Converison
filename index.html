<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Ingestion Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input[type="text"], select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .drop-zone {
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(15, 23, 42, 0.4);
            margin-bottom: 2rem;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .drop-zone-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.8;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .drop-zone:hover .drop-zone-icon {
            transform: translateY(-5px);
        }

        .drop-zone-text {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .drop-zone-sub {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        #file-input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        #file-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .file-chip {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: none;
        }

        .results.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Semantic Ingestion</h1>
        <p class="subtitle">Enterprise Data Conversion Portal</p>

        <form id="uploadForm">
            <div class="form-grid">
                <div class="input-group">
                    <label for="usecase_id">Use-Case ID</label>
                    <input type="text" id="usecase_id" name="usecase_id" value="credit-rules" required>
                </div>
                <div class="input-group">
                    <label for="identifier">Identifier</label>
                    <input type="text" id="identifier" name="identifier" value="underwriting-team" required>
                </div>
                <div class="input-group">
                    <label for="data_classification">Classification</label>
                    <select id="data_classification" name="data_classification">
                        <option value="internal">Internal</option>
                        <option value="confidential" selected>Confidential</option>
                        <option value="public">Public</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="chunk_mode">Processing Mode</label>
                    <select id="chunk_mode">
                        <option value="chunked">Semantic Chunking (Standard)</option>
                        <option value="unchunked">Whole-File (Bypass)</option>
                    </select>
                </div>
            </div>

            <div class="drop-zone" id="dropZone">
                <span class="drop-zone-icon">📄</span>
                <div class="drop-zone-text">Drag & drop enterprise files here</div>
                <div class="drop-zone-sub">or click to browse (.xlsx, .docx, .md, .txt, .json, .yaml)</div>
                <input type="file" id="file-input" multiple name="files">
                <div id="file-list"></div>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span class="btn-text">Process Pipeline</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>

        <div class="results" id="results">
            <h3 style="color: var(--success); margin-bottom: 0.5rem;" id="res-title">Success</h3>
            <p id="res-desc"></p>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.querySelector('.btn-text');
        const spinner = document.getElementById('spinner');
        const results = document.getElementById('results');
        const resTitle = document.getElementById('res-title');
        const resDesc = document.getElementById('res-desc');

        // Drag & Drop visual feedback
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            let dt = e.dataTransfer;
            let files = dt.files;
            fileInput.files = files; // Assign dropped files to input
            updateFileList();
        });

        fileInput.addEventListener('change', updateFileList);

        function updateFileList() {
            fileList.innerHTML = '';
            Array.from(fileInput.files).forEach(file => {
                const chip = document.createElement('div');
                chip.className = 'file-chip';
                chip.innerHTML = `<span>📑</span> ${file.name}`;
                fileList.appendChild(chip);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (fileInput.files.length === 0) {
                showResult(false, 'Please select at least one file.');
                return;
            }

            // UI Loading state
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            submitBtn.disabled = true;
            results.style.display = 'none';

            const formData = new FormData();
            Array.from(fileInput.files).forEach(f => formData.append('files', f));
            
            // If only 1 file and standard endpoints expect 'file', handle routing
            const fileCount = fileInput.files.length;
            const mode = document.getElementById('chunk_mode').value;
            
            // Append metadata
            const params = new URLSearchParams({
                usecase_id: document.getElementById('usecase_id').value,
                identifier: document.getElementById('identifier').value,
                data_classification: document.getElementById('data_classification').value
            });

            // Determine endpoint
            let endpoint = '/convert/batch';
            if (mode === 'unchunked') {
                endpoint = '/convert/batch/unchunked';
            }

            try {
                const response = await fetch(`${endpoint}?${params}`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(true, `Successfully processed ${fileCount} files into ${data.total_chunks} chunk(s) in ${data.processing_time_ms}ms. Output JSONL ready.`);
                } else {
                    showResult(false, data.detail || 'API Error occurred.');
                }
            } catch (err) {
                showResult(false, 'Network error. Is the server running?');
            } finally {
                btnText.style.display = 'block';
                spinner.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        function showResult(isSuccess, message) {
            results.style.display = 'block';
            results.className = isSuccess ? 'results' : 'results error';
            resTitle.style.color = isSuccess ? 'var(--success)' : 'var(--error)';
            resTitle.textContent = isSuccess ? 'Pipeline Complete' : 'Processing Error';
            resDesc.textContent = message;
        }
    </script>
</body>
</html>
